Q('s1','Crema catalana','Postres','45 min',4,'500 ml llet|4 rovells d\'ou|100 g sucre|2 cullerades de maizena|1 pell de llimona|1 branca de canyella','Escalfa la llet amb la pell de llimona i la canyella i deixa-la reposar 10 minuts.|Barreja els rovells amb el sucre i la maizena fins que quedi una pasta suau.|Cola la llet sobre la barreja i remena bé.|Cou-ho a foc baix sense parar de remenar fins que espesseixi.|Reparteix-ho en cassoletes i deixa-ho refredar a la nevera.|Abans de servir, crema-ho amb una capa fina de sucre.','No deixis mai de remenar: si bull, es talla.'),

Q('c1','Escudella i carn d\'olla','Primers','3 h',6,'300 g galets|1 os de porc|250 g vedella|1/2 gallina|2 botifarres (blanca i negra)|1 pastanaga|1 nap|2 patates|1 col|200 g cigrons cuits|sal','Posa a bullir aigua amb l\'os, la vedella i la gallina i espuma-ho.|Afegeix-hi les verdures i els cigrons i deixa-ho coure a foc suau 2 hores.|Afegeix les botifarres els últims 30 minuts.|Cola el brou i cou-hi els galets.|Serveix primer l\'escudella i després la carn i les verdures com a segon.','Els galets es couen al moment perquè no s\'inflin.'),
Q('c2','Canelons','Primers','2 h',6,'12 plaques de canelons|300 g carn picada de porc i vedella|200 g restes de rostit|1 ceba|50 g mantega|50 g farina|750 ml llet|50 g formatge ratllat|nou moscada|sal','Sofregeix la ceba i daura-hi la carn picada i el rostit; deixa-ho refredar i tritura-ho.|Bull les plaques en aigua amb sal, escorre-les i eixuga-les.|Farceix-les amb la carn i enrotlla-les.|Fes la beixamel: fon la mantega, afegeix la farina i, a poc a poc, la llet amb sal i nou moscada.|Cobreix els canelons amb la beixamel i el formatge i gratina al forn a 200 °C uns 15 minuts.','El plat típic de Sant Esteve.'),

Q('c8','Truita de patates','Segons','40 min',4,'600 g patates|1 ceba|6 ous|oli d\'oliva|sal','Pela i talla les patates a làmines i fregeix-les amb la ceba a foc suau.|Escorre-les i barreja-les amb els ous batuts i sal.|Quaja la truita a la paella per un costat.|Gira-la amb un plat i quaja-la per l\'altre.','Deixa-la una mica melosa per dins.'),
Q('c9','Cigrons amb espinacs','Segons','30 min',4,'400 g cigrons cuits|500 g espinacs|3 grans d\'all|1 culleradeta de pebre vermell dolç|oli d\'oliva|sal','Bull els espinacs i escorre\'ls.|Daura els alls amb oli i afegeix-hi el pebre vermell.|Hi poses els cigrons i els espinacs i ho deixes coure 10 minuts.|Rectifica de sal i serveix.'),
Q('c10','Faves a la catalana','Segons','1 h',4,'1 kg faves tendres|150 g botifarra negra|100 g cansalada|1 ceba|1 ramet de menta|1 got de vi ranci|oli d\'oliva|sal','Sofregeix la ceba i la cansalada tallada.|Afegeix la botifarra a rodanxes i les faves i remena-ho.|Hi poses el vi ranci i la menta.|Cou-ho tapat a foc suau uns 30 minuts.','Un plat de primavera.'),

Q('c13','Mandonguilles amb sípia','Carns','1 h 30',4,'500 g carn picada|1 ou|2 cullerades de pa ratllat|2 sípies|1 ceba|2 tomàquets|1 got de vi blanc|farina|oli d\'oliva|sal','Barreja la carn amb l\'ou, el pa ratllat i sal i fes-ne boles.|Enfarina-les i daura-les; reserva-les.|Sofregeix la ceba, la sípia a trossos i el tomàquet.|Afegeix-hi el vi i aigua, les mandonguilles i cou-ho 30 minuts.','Un clàssic de mar i muntanya.'),

Q('c15','Suquet de peix','Peix','1 h',4,'800 g peix de roca i rap|500 g patates|1 ceba|2 tomàquets|1 cullerada de pebre vermell|1 picada d\'ametlles i all|1 got de vi blanc|oli d\'oliva|sal','Fes un sofregit amb la ceba i el tomàquet.|Afegeix-hi les patates a rodanxes, el pebre vermell, el vi i aigua.|Cou-ho 15 minuts i afegeix-hi el peix.|Hi poses la picada d\'ametlles i all i ho cous 10 minuts més.'),
Q('c16','Arròs a la cassola','Arrossos','50 min',4,'300 g arròs|200 g costelles de porc|2 botifarres|1 ceba|2 tomàquets|1 l brou|safrà|oli d\'oliva|sal','Daura les costelles i les botifarres a trossos.|Afegeix-hi el sofregit de ceba i tomàquet.|Hi poses l\'arròs i el brou calent amb el safrà.|Cou-ho 18 minuts i deixa-ho reposar 5 minuts.'),
Q('c17','Fideuà','Arrossos','45 min',4,'300 g fideus del número 2|500 g peix i marisc|1 ceba|2 tomàquets|1 l fumet de peix|oli d\'oliva|sal|all-i-oli per servir','Fes un sofregit amb la ceba i el tomàquet.|Afegeix-hi el peix i els fideus i remena-ho.|Cobreix-ho amb el fumet calent.|Cou-ho uns 10 minuts i gratina-ho uns minuts al forn.|Serveix-ho amb all-i-oli.'),

Q('c19','Postres de músic','Postres','10 min',4,'100 g ametlles|100 g avellanes|100 g panses|100 g nous|100 g figues seques|1 copa de moscatell','Posa els fruits secs en un plat.|Serveix-los amb una copa de moscatell per mullar-hi.'),

Q('c21','Llet fregida','Dolços','1 h',6,'500 ml llet|60 g farina|60 g sucre|1 branca de canyella|1 pell de llimona|farina i ou per arrebossar|oli per fregir|sucre i canyella en pols','Escalfa la llet amb la canyella i la llimona.|Dissol la farina i el sucre amb una mica de llet freda i afegeix-ho a la resta.|Cou-ho remenant fins que espesseixi.|Estén-ho en un plat i deixa-ho refredar.|Talla-ho a quadrats, passa\'ls per farina i ou i fregeix-los.|Empolsina\'ls amb sucre i canyella.'),
Q('p1','Paella','Arrossos','1 h',4,'320 g arròs|400 g pollastre i conill a trossos|150 g mongeta tendra|100 g garrofó|2 tomàquets ratllats|1 l brou|safrà|oli d\'oliva|sal','Daura la carn salada a la paella amb oli.|Afegeix-hi la verdura i el tomàquet ratllat i sofregeix-ho.|Hi poses el brou i el safrà i deixa-ho bullir 20 minuts.|Escampa l\'arròs, cou-ho 18 minuts i deixa-ho reposar 5 minuts.','No remenis l\'arròs un cop l\'has tirat.'),

Q('p3','Calçotada','Primers','45 min',4,'24 calçots|1 ració de salsa romesco|sal','Posa els calçots a la graella amb flama viva fins que quedin negres per fora.|Embolica\'ls en paper de diari 15 minuts.|Pela\'ls i mulla\'ls a la salsa romesco.','Es mengen amb pitet i amb les mans.'),
Q('p4','Sopa d\'all','Primers','25 min',4,'6 grans d\'all|4 llesques de pa dur|1 culleradeta de pebre vermell dolç|1 l d\'aigua o brou|4 ous|oli d\'oliva|sal','Daura els alls laminats amb oli i afegeix-hi el pa.|Hi poses el pebre vermell i el brou i ho cous 10 minuts.|Escalfa-hi els ous perquè quallin.'),

Q('p6','Amanida catalana','Primers','15 min',4,'1 enciam|2 tomàquets|100 g botifarra d\'ou|100 g llonganissa|2 ous durs|1 ceba tendra|oli d\'oliva|vinagre|sal','Talla els ingredients i col·loca\'ls en una safata.|Afegeix-hi la botifarra, la llonganissa i els ous.|Amaneix amb oli, vinagre i sal.'),

Q('p21','Estofat de vedella','Carns','2 h',4,'800 g vedella a daus|3 patates|2 pastanagues|1 ceba|1 got de vi negre|farina|oli d\'oliva|sal','Enfarina la carn i daura-la.|Sofregeix la ceba i afegeix-hi el vi.|Cobreix de brou o aigua i cou-ho 1 hora 15 minuts.|Afegeix-hi les patates i les pastanagues i cou-ho 30 minuts.'),
Q('p22','Costelles de xai a la brasa','Carns','20 min',4,'12 costelles de xai|oli d\'oliva|sal|all-i-oli per servir','Sala les costelles.|Fes-les a la brasa uns 4 minuts per banda.|Serveix-les amb all-i-oli.'),
Q('p23','Gall d\'indi farcit de Nadal','Carns','3 h',8,'1 gall d\'indi|300 g carn picada|100 g prunes|100 g orellanes|100 g pinyons|1 got de conyac|sal','Barreja la carn picada amb les prunes, les orellanes, els pinyons i el conyac.|Farceix l\'ocell i cus-lo.|Rosteix-lo al forn a 180 °C unes 2 hores i 30 minuts.'),
Q('p24','Pollastre rostit amb prunes i pinyons','Carns','1 h 30',4,'1 pollastre|150 g prunes|50 g pinyons|1 got de vi ranci|oli d\'oliva|sal','Sala el pollastre i posa-lo en una safata amb oli.|Afegeix-hi les prunes, els pinyons i el vi.|Rosteix-ho al forn a 190 °C 1 hora i 15 minuts.'),
Q('p25','Bunyols de bacallà','Peix','40 min',6,'200 g bacallà dessalat|150 g farina|1 ou|1 got de cervesa|1 gra d\'all|julivert|oli per fregir','Desfés el bacallà i pica\'l.|Barreja la farina amb l\'ou i la cervesa i afegeix-hi el bacallà, l\'all i el julivert.|Fregeix cullerades de massa en oli calent.'),
Q('p26','Calamars a la romana','Peix','25 min',4,'500 g calamars|100 g farina|2 ous|1 llimona|oli per fregir|sal','Talla els calamars a anelles.|Passa\'ls per farina i ou.|Fregeix-los fins que quedin daurats i serveix-los amb llimona.'),
Q('p27','Musclos a la marinera','Peix','20 min',4,'1 kg musclos|1 ceba|2 grans d\'all|1 got de vi blanc|julivert|oli d\'oliva','Sofregeix la ceba i els alls.|Afegeix-hi els musclos nets i el vi.|Tapa-ho i cou-ho fins que s\'obrin.|Escampa-hi el julivert.'),
Q('p28','Bacallà a la llauna','Peix','30 min',4,'4 talls de bacallà dessalat|4 grans d\'all|1 culleradeta de pebre vermell|1 got de vi blanc|farina|oli d\'oliva','Enfarina el bacallà i daura\'l.|Daura els alls i afegeix-hi el pebre i el vi.|Hi poses el bacallà i ho cous 8 minuts.'),
Q('p29','Sípia amb mongetes seques','Peix','1 h',4,'2 sípies|400 g mongetes cuites|1 ceba|2 tomàquets|1 got de vi blanc|oli d\'oliva|sal','Sofregeix la ceba i la sípia a trossos.|Hi poses el tomàquet i el vi i ho cous 30 minuts.|Afegeix-hi les mongetes i cou-ho 10 minuts.'),
Q('p30','Sardines a la brasa','Peix','15 min',4,'800 g sardines|oli d\'oliva|sal gruixuda|llimona','Sala les sardines.|Fes-les a la brasa 3 minuts per banda.|Serveix-les amb llimona i un raig d\'oli.'),
Q('p31','Arròs negre','Arrossos','50 min',4,'320 g arròs|400 g sípia|1 ceba|2 tomàquets|1 sobre de tinta|1 l fumet de peix|all-i-oli|oli d\'oliva|sal','Sofregeix la ceba i la sípia a trossos.|Afegeix-hi el tomàquet i la tinta.|Hi poses l\'arròs i el fumet calent i cou-ho 18 minuts.|Serveix-ho amb all-i-oli.'),
Q('p32','Arròs de muntanya','Arrossos','1 h',4,'320 g arròs|200 g costelles de porc|2 botifarres|100 g cunillets|1 ceba|2 tomàquets|1 l brou|oli d\'oliva|sal','Daura la carn i la botifarra.|Afegeix-hi el sofregit de ceba i tomàquet.|Hi poses l\'arròs i el brou.|Cou-ho 18 minuts i deixa-ho reposar.','Plat de diumenge i de festa a les cases de pagès.'),
Q('p33','Fideus a la cassola','Arrossos','45 min',4,'300 g fideus|300 g costelles de porc|2 botifarres|1 ceba|2 tomàquets|1 l brou|oli d\'oliva|sal','Daura la carn i sofregeix la ceba i el tomàquet.|Afegeix-hi els fideus i remena-ho.|Cobreix-ho amb brou calent i cou-ho 10 minuts.'),
Q('p34','Macarrons gratinats','Primers','40 min',4,'300 g macarrons|300 g carn picada|1 ceba|2 tomàquets|100 g formatge ratllat|oli d\'oliva|sal','Fes un sofregit amb la ceba, la carn i el tomàquet.|Bull els macarrons i barreja-ho amb la carn.|Cobreix-ho amb formatge i gratina-ho 10 minuts.'),
Q('p35','Arròs amb llet','Postres','50 min',4,'1 l llet|150 g arròs|120 g sucre|1 pell de llimona|1 branca de canyella|canyella en pols','Bull l\'arròs amb una mica d\'aigua 5 minuts i escorre\'l.|Afegeix-hi la llet, la llimona i la canyella.|Cou-ho 30 minuts a foc suau, remenant.|Afegeix-hi el sucre i serveix-ho amb canyella.'),
Q('p36','Menjar blanc','Postres','40 min',6,'500 ml llet d\'ametlla|60 g sucre|50 g maizena|1 branca de canyella|1 pell de llimona|mel','Dissol la maizena amb una mica de llet freda.|Escalfa la resta amb el sucre, la canyella i la llimona.|Hi afegeixes la maizena i cou-ho remenant.|Aboca-ho a copes i deixa-ho refredar.'),
Q('p37','Pa de pessic','Dolços','50 min',8,'4 ous|120 g sucre|120 g farina|1 sobre de llevat|1 pessic de sal','Bat els ous amb el sucre fins que doblin el volum.|Afegeix-hi la farina amb el llevat.|Cou-ho en un motlle al forn a 180 °C 30 minuts.'),
Q('p38','Magdalenes','Dolços','35 min',12,'3 ous|150 g sucre|150 g farina|120 ml oli suau|1 sobre de llevat|1 pell de llimona','Bat els ous amb el sucre.|Afegeix-hi l\'oli, la llimona i la farina amb el llevat.|Omple els motlles i cou-ho al forn a 200 °C 15 minuts.'),
Q('p39','Peres al vi','Postres','50 min',4,'4 peres|500 ml vi negre|100 g sucre|1 branca de canyella|1 pell de llimona','Pela les peres sense treure\'ls el cap.|Posa-les en una cassola amb el vi, el sucre i la canyella.|Cou-les 35 minuts a foc suau.|Serveix-les fredes amb el seu suc.'),
Q('p40','Carquinyolis','Dolços','45 min',20,'250 g farina|200 g sucre|150 g ametlles torrades|2 ous|1 pessic de llevat','Barreja-ho tot fins a fer una massa.|Fes-ne rotllos i couen-los a 180 °C 20 minuts.|Talla\'ls a llesques i torna-los al forn 10 minuts.'),
Q('p41','Bunyols de Quaresma','Dolços','1 h 30',20,'250 g farina|250 ml llet|2 ous|50 g sucre|1 pell de llimona|oli per fregir|sucre per rebossar','Fes una pasta amb la llet, la farina i la llimona.|Afegeix-hi els ous i el sucre.|Fregeix boles de massa.|Rebossa-les amb sucre.'),
Q('p42','Orelletes','Dolços','45 min',20,'250 g farina|2 ous|50 g sucre|50 ml oli|1 culleradeta d\'anís|oli per fregir|sucre','Barreja-ho tot fins a fer una massa i deixa-la reposar.|Estén-la fina i talla-ne trossos.|Fregeix-los i passa\'ls per sucre.'),
Q('p43','Coca de Sant Joan','Dolços','1 h 30',8,'500 g farina|120 g sucre|3 ous|100 g mantega|25 g llevat|fruita confitada|pinyons|sucre','Fes una massa amb la farina, el sucre, els ous, la mantega i el llevat.|Deixa-la reposar 1 hora.|Estén-la, decora-la amb la fruita i els pinyons.|Cou-ho a 180 °C uns 25 minuts.'),
Q('p44','All-i-oli','Altres','15 min',6,'4 grans d\'all|1 got d\'oli d\'oliva|sal','Pica els alls al morter amb sal fins que facin pasta.|Afegeix-hi l\'oli gota a gota.|Remena sempre en el mateix sentit fins que quedi lligat.'),
Q('p45','Salsa romesco','Altres','20 min',6,'2 tomàquets|1 cap d\'all|2 nyores|50 g ametlles torrades|50 g avellanes|1 got d\'oli|vinagre|sal','Rosteix els tomàquets i el cap d\'all al forn.|Posa-hi la polpa de les nyores.|Pica-ho al morter amb els fruits secs.|Lliga-ho amb oli i vinagre.'),
Q('p46','Sofregit','Altres','45 min',6,'4 cebes|4 tomàquets|3 grans d\'all|oli d\'oliva|sal','Talla la ceba a trossos petits i sofregeix-la a foc suau.|Afegeix-hi l\'all i el tomàquet ratllat.|Cou-ho molt a poc a poc fins que quedi espès.','És la base de molts plats catalans.')];

let R=JSON.parse(localStorage.getItem('rdi.r')||'null')||SEED,SH=JSON.parse(localStorage.getItem('rdi.s')||'[]'),S={v:'home',q:'',cat:'Totes',fav:0},WL;
let D=JSON.parse(localStorage.getItem('rdi.d')||'[]');SEED.forEach(s=>{if(!R.some(r=>r.id==s.id)&&!D.includes(s.id))R.push(s)});const save=()=>{localStorage.setItem('rdi.d',JSON.stringify(D));localStorage.setItem('rdi.r',JSON.stringify(R));localStorage.setItem('rdi.s',JSON.stringify(SH))},get=id=>R.find(r=>r.id==id);R.forEach(r=>{const x=inferCook(r);if(!r.preheat)r.preheat=x.preheat;if(!r.fire)r.fire=x.fire;if(!r.cooktime)r.cooktime=x.cooktime});save();
const f=n=>String(Math.round(n*100)/100).replace('.',',');
function sc(l,k){const m=l.match(/^(\d+(?:[.,]\d+)?)(?:\s*\/\s*(\d+))?\s*(.*)$/);if(!m)return l;let n=parseFloat(m[1].replace(',','.'));if(m[2])n/=+m[2];return f(n*k)+' '+m[3]}
function go(v,o={}){Object.assign(S,{v},o);render();scrollTo(0,0)}
function render(){$('#app').innerHTML=({home,det,cook,shop,form})[S.v]();$('#nav').hidden=S.v=='cook';const n=SH.filter(s=>!s.d).length;$('#bc').textContent=n?'('+n+')':''}
const filt=()=>R.filter(r=>(S.cat=='Totes'||r.cat==S.cat)&&(!S.fav||r.fav)&&(r.t+' '+r.ing.join(' ')).toLowerCase().includes(S.q.toLowerCase()));
const cards=l=>l.map(r=>`<article class="card" onclick="show('${r.id}')"><div><h3>${e(r.t)}</h3><p>${e(r.cat)}${r.time?', '+e(r.time):''}</p></div>${r.fav?'<span class="h">♥</span>':''}</article>`).join('')||'<p class="empty">No hi ha cap recepta amb aquest filtre. Prova una altra cerca o afegeix-ne una de nova.</p>';
const list=()=>$('#list').innerHTML=cards(filt());
function home(){return `<header class="hero"><img src="logo.jpg" alt="Receptes de la Iaia"></header>
<button class="main" onclick="$('#cam').click()">Fes una foto d'una recepta</button><input id="cam" type="file" accept="image/*" capture="environment" hidden onchange="scan(this)">
<button class="ghost" style="width:100%" onclick="$('#gal').click()">Tria una foto de la galeria</button><input id="gal" type="file" accept="image/*" hidden onchange="scan(this)">
<button id="inst" class="ghost" style="width:100%" ${IP?'':'hidden'} onclick="IP.prompt()">Instal·la l'app al mòbil</button>
<input id="q" type="search" placeholder="Cerca una recepta o un ingredient" value="${e(S.q)}" oninput="S.q=this.value;list()">
<div class="chips">${['Totes',...CATS].map(c=>`<button class="chip ${S.cat==c?'on':''}" onclick="S.cat='${c}';render()">${c}</button>`).join('')}<button class="chip ${S.fav?'on':''}" onclick="S.fav=!S.fav;render()">♥ Preferides</button></div>
<div id="list">${cards(filt())}</div>
<div class="row"><button class="ghost" onclick="exp()">Desa còpia</button><button class="ghost" onclick="$('#imp').click()">Recupera còpia</button></div><input id="imp" type="file" accept=".json" hidden onchange="imp(this)">`}
function show(id){go('det',{id,srv:get(id).serv})}
function det(){const r=get(S.id),k=S.srv/r.serv;return `<div class="bar"><button onclick="go('home')">‹ Receptes</button><button onclick="fav('${r.id}')" aria-label="Preferida">${r.fav?'♥':'♡'}</button></div>
<h1>${e(r.t)}</h1><p class="meta">${e(r.cat)}${r.time?', '+e(r.time):''}</p>
<div class="cookmeta"><p><b>Preescalfament:</b> ${e(r.preheat||'No cal preescalfament específic')}</p><p><b>Intensitat del foc:</b> ${e(r.fire||'Moderat')}</p><p><b>Temps de cocció:</b> ${e(r.cooktime||r.time||'Segons els passos')}</p></div>
<div class="srv"><button onclick="srv(-1)" aria-label="Menys">−</button><b>${S.srv} racions</b><button onclick="srv(1)" aria-label="Més">+</button></div>
<h2>Ingredients</h2><ul class="ing">${r.ing.map(i=>`<li>${e(sc(i,k))}</li>`).join('')}</ul>
<button class="ghost" onclick="addShop()">Afegeix a la llista de la compra</button>
<h2>Elaboració</h2><ol>${r.steps.map(s=>`<li>${e(s)}</li>`).join('')}</ol>${r.note?`<p class="note"><b>El truc de la iaia:</b> ${e(r.note)}</p>`:''}
<button class="main" onclick="startCook()">Comença a cuinar</button>
<div class="row"><button class="ghost" onclick="edit('${r.id}')">Edita</button><button class="ghost" onclick="del('${r.id}')">Esborra</button></div>`}
function fav(id){const r=get(id);r.fav=r.fav?0:1;save();render()}
function srv(d){S.srv=Math.max(1,S.srv+d);render()}
function addShop(){const r=get(S.id),k=S.srv/r.serv;r.ing.forEach(i=>SH.push({t:sc(i,k)}));save();go('shop')}
function del(id){if(confirm('Vols esborrar aquesta recepta?')){D.push(id);R=R.filter(r=>r.id!=id);save();go('home')}}
async function wl(on){try{if(on)WL=await navigator.wakeLock.request('screen');else WL&&WL.release()}catch{}}
function startCook(){wl(1);go('cook',{i:0})}
function nxt(){if(S.i<get(S.id).steps.length-1){S.i++;render()}else{wl(0);go('det')}}
function cook(){const r=get(S.id),n=r.steps.length,k=S.srv/r.serv;return `<div class="bar"><button onclick="wl(0);go('det')">Tanca</button><b>Pas ${S.i+1} de ${n}</b></div>
<div class="cookmeta"><p><b>Foc:</b> ${e(r.fire||'Moderat')}</p><p><b>Temps orientatiu:</b> ${e(r.cooktime||r.time||'Segons els passos')}</p></div><p class="big">${e(r.steps[S.i])}</p><details><summary>Ingredients</summary><ul class="ing">${r.ing.map(i=>`<li>${e(sc(i,k))}</li>`).join('')}</ul></details>
<div class="row"><button class="ghost" ${S.i?'':'disabled'} onclick="S.i--;render()">Anterior</button><button class="main" onclick="nxt()">${S.i<n-1?'Següent':'Fet, bon profit!'}</button></div>`}
function shop(){return `<h1>Llista de la compra</h1><form class="row" onsubmit="return addS()"><input id="si" placeholder="Afegeix un producte"><button class="main" style="flex:0 0 110px;margin:0">Afegeix</button></form>
<ul class="sh">${SH.map((s,i)=>`<li class="${s.d?'done':''}" onclick="tg(${i})">${e(s.t)}</li>`).join('')||'<p class="empty">No hi ha res per comprar. Afegeix ingredients des d\'una recepta.</p>'}</ul>
${SH.length?`<div class="row"><button class="ghost" onclick="SH=SH.filter(s=>!s.d);save();render()">Treu els marcats</button><button class="ghost" onclick="SH=[];save();render()">Buida-la</button></div>`:''}`}
function addS(){const v=$('#si').value.trim();if(v){SH.push({t:v});save();render()}return false}
function tg(i){SH[i].d=!SH[i].d;save();render()}
function edit(id){go('form',{ed:get(id)})}
function form(){const r=S.ed||S.draft||{t:'',cat:'Primers',time:'',serv:4,ing:[],steps:[],note:''};return `<div class="bar"><button onclick="${S.ed?"go('det')":"go('home')"}">‹ Cancel·la</button></div><h1>${S.ed?'Edita la recepta':'Nova recepta'}</h1>${S.draft&&!S.ed?'<p class="note">Això és el que he llegit de la foto. Revisa-ho i corregeix el que calgui abans de desar.</p>':''}
<label>Nom<input id="ft" value="${e(r.t)}"></label><label>Tipus<select id="fc">${CATS.map(c=>`<option ${c==r.cat?'selected':''}>${c}</option>`).join('')}</select></label>
<div class="row"><label>Temps total<input id="fm" value="${e(r.time)}" placeholder="45 min"></label><label>Racions<input id="fs" type="number" min="1" value="${r.serv}"></label></div>
<label>Preescalfament<input id="fpre" value="${e(r.preheat||'')}" placeholder="Ex. forn a 180 °C, 10-15 min"></label><label>Intensitat del foc<input id="ffire" value="${e(r.fire||'Moderat')}" placeholder="Fluix, moderat, fort o forn"></label><label>Temps de cocció<input id="fct" value="${e(r.cooktime||r.time||'')}" placeholder="Ex. 25 minuts"></label>
<label>Ingredients (un per línia, ex. 200 g sucre)<textarea id="fi" rows="7">${e(r.ing.join('\n'))}</textarea></label>
<label>Elaboració (un pas per línia)<textarea id="fp" rows="8">${e(r.steps.join('\n'))}</textarea></label>
<label>El truc de la iaia<textarea id="fn" rows="2">${e(r.note)}</textarea></label><button class="main" onclick="saveF()">Desa la recepta</button>`}
function saveF(){const L=v=>$('#'+v).value.split('\n').map(s=>s.trim()).filter(Boolean),t=$('#ft').value.trim();if(!t)return alert('Posa-hi un nom a la recepta.');
const o={t,cat:$('#fc').value,time:$('#fm').value.trim(),serv:Math.max(1,+$('#fs').value||4),preheat:$('#fpre').value.trim(),fire:$('#ffire').value.trim(),cooktime:$('#fct').value.trim(),ing:L('fi'),steps:L('fp'),note:$('#fn').value.trim()};
if(S.ed){Object.assign(S.ed,o);S.srv=S.ed.serv;save();go('det')}else{o.id=Date.now().toString(36);S.draft=null;R.push(o);save();show(o.id)}}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({r:R,s:SH})],{type:'application/json'}));a.download='receptes-de-la-iaia.json';a.click()}
function imp(i){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!Array.isArray(d.r))throw 0;R=d.r;SH=d.s||[];save();render();alert('Receptes recuperades.')}catch{alert('Aquest fitxer no és una còpia vàlida.')}};fr.readAsText(i.files[0])}
let IP,TS;addEventListener('beforeinstallprompt',v=>{v.preventDefault();IP=v;const b=$('#inst');if(b)b.hidden=false});
const loadTS=()=>TS||(TS=new Promise((ok,ko)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=ok;s.onerror=()=>{TS=null;ko()};document.head.appendChild(s)}));
const busy=t=>{const b=$('#busy');b.hidden=!t;b.textContent=t||''};
const small=f=>new Promise(res=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;const x=c.getContext('2d');x.filter='grayscale(1) contrast(1.3)';x.drawImage(i,0,0,c.width,c.height);c.toBlob(res,'image/jpeg',.9)};i.src=URL.createObjectURL(f)});
async function scan(inp){const fl=inp.files[0];inp.value='';if(!fl)return;
try{busy('Preparant la foto...');await loadTS();const img=await small(fl);
const o=await Tesseract.recognize(img,'cat+spa',{logger:m=>busy((m.status=='recognizing text'?'Llegint la recepta':'Descarregant l\'idioma')+(m.progress?' '+Math.round(m.progress*100)+'%':'')+'...')});
busy();draft(o.data.text)}catch(x){busy();alert('No he pogut llegir la foto. La primera vegada cal tenir connexió. Torna-ho a provar.')}}
function draft(t){const L=t.split('\n').map(s=>s.replace(/^[-•*]\s*/,'').trim()).filter(s=>s.length>1),H=/^(ingredients?|ingredientes)\b/i,P=/^(elaboraci|preparaci|procediment|passos|pasos|modo de)/i;
const hi=L.findIndex(s=>H.test(s)),hs=L.findIndex(s=>P.test(s)),ti=(hi==0||hs==0)?'':(L[0]||''),body=L.slice(ti?1:0).filter(s=>!H.test(s)&&!P.test(s)),isI=s=>/^\d/.test(s)&&s.length<50;
let ing,st;if(hi>=0&&hs>hi){ing=L.slice(hi+1,hs);st=L.slice(hs+1)}else{ing=body.filter(isI);st=body.filter(s=>!isI(s))}
if(!ing.length&&!st.length)st=L;go('form',{ed:null,draft:{t:ti,cat:'Altres',time:'',serv:4,ing,steps:st,note:''}})}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
